name: Harness iOS

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: 'iOS Simulator device model'
        required: false
        default: 'iPhone 16 Pro'
        type: string
      ios_version:
        description: 'iOS version'
        required: false
        default: '18.0'
        type: string
      xcode_version:
        description: 'Xcode version'
        required: false
        default: '16.0'
        type: string
  push:
    branches:
      - main
      - v4_9
    paths:
      - 'apps/example/__tests__/**'
      - 'apps/example/src/**'
      - 'apps/example/ios/**'
      - 'apps/example/rn-harness.config.mjs'
      - 'apps/example/package.json'
      - 'src/**'
      - 'ios/**'
      - '.github/workflows/harness-ios.yml'
  pull_request:
    paths:
      - 'apps/example/__tests__/**'
      - 'apps/example/src/**'
      - 'apps/example/ios/**'
      - 'apps/example/rn-harness.config.mjs'
      - 'apps/example/package.json'
      - 'src/**'
      - 'ios/**'
      - '.github/workflows/harness-ios.yml'

env:
  DEVICE_MODEL: ${{ inputs.device_model || 'iPhone 16 Pro' }}
  IOS_VERSION: ${{ inputs.ios_version || '18.0' }}
  XCODE_VERSION: ${{ inputs.xcode_version || '16.0' }}

jobs:
  harness_ios:
    name: Harness Tests iOS
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install example app dependencies
        working-directory: apps/example
        run: bun install

      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            apps/example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: apps/example/ios
        run: pod install

      - name: Build iOS app
        working-directory: apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroSpeechExample.xcworkspace \
            -scheme NitroSpeechExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,arch=arm64,name=${{ env.DEVICE_MODEL }}' \
            -showBuildTimingSummary \
            ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | xcbeautify --renderer github-actions

      - name: Install Watchman
        run: brew install watchman

      - name: Run Harness E2E tests
        uses: callstackincubator/react-native-harness@v1.2.0
        with:
          runner: ios
          projectRoot: apps/example
          app: ios/build/Build/Products/Debug-iphonesimulator/NitroSpeechExample.app
          packageManager: bun

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-ios-results
          path: |
            apps/example/junit.xml
            apps/example/.harness/
