buildscript {
    ext {
        compileSdkVersion = 36
        minSdkVersion = 24
        targetSdkVersion = 36
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

repositories {
    google()
    mavenCentral()
}

android {
    namespace "com.margelo.nitro.nitrospeech.unittests"
    compileSdk compileSdkVersion

    defaultConfig {
        minSdk minSdkVersion
        targetSdk targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.jvmArgs += ["-Drobolectric.logging=stdout"]
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java {
                srcDirs = ["../../android/src/main/java"]
                exclude "com/margelo/nitro/nitrospeech/HybridNitroSpeech.kt"
                exclude "com/margelo/nitro/nitrospeech/NitroSpeechPackage.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/HybridRecognizer.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/RecognitionListenerSession.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/AudioPermissionRequester.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/OnDeviceSupport.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/HapticImpact.kt"
            }
            kotlin {
                srcDirs = ["../../android/src/main/java"]
                exclude "com/margelo/nitro/nitrospeech/HybridNitroSpeech.kt"
                exclude "com/margelo/nitro/nitrospeech/NitroSpeechPackage.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/HybridRecognizer.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/RecognitionListenerSession.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/AudioPermissionRequester.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/OnDeviceSupport.kt"
                exclude "com/margelo/nitro/nitrospeech/recognizer/HapticImpact.kt"
            }
        }
        test {
            java.srcDirs = ["../../android/src/test/java"]
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
